<!doctype html>
<html lang="en">
<head>

<body>
  <header class="site-header">
    <a class="brand" id="brand" href="demo.html">Soumaya's Studio</a>
    <button id="theme-toggle" class="icon-btn" type="button" aria-label="Toggle dark mode" title="Toggle dark mode">
      <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>

  <div class="demo-banner">Demo version — sample projects with freely licensed photos. Real items appear once Firebase is configured (see README.md).</div>

  <main>
    <section class="hero">
      <p class="kicker" id="hero-kicker">Interior design portfolio</p>
      <h1 id="hero-title">Soumaya's Studio</h1>
      <p class="lede" id="hero-text">Thoughtful spaces, crafted with care.</p>
    </section>

    <section id="gallery" class="gallery"></section>
    <p id="status" class="status" role="status"></p>
  </main>

  <footer class="site-footer">
    © <span id="year"></span> <span id="footer-name">Soumaya's Studio</span>
    <a class="admin-link" href="admin.html">Admin</a>

      <div>

        <p id="lightbox-desc"></p>
      </div>
      <a id="lightbox-link" class="gh-btn" href="#" target="_blank" rel="noopener noreferrer">

  </div>

  <script src="firebase-config.js"></script>
  <script src="demo-data.js"></script>
  <script src="common.js"></script>
  <script src="app.js"></script>
</body>
</html>
