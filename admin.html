<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#faf8f6">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#161413">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23a06a3f'/%3E%3Cpath d='M20 42V22h6l12 12V22h6v20h-6L26 30v12z' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" id="brand" href="index.html">Portfolio</a>
    <button id="theme-toggle" class="icon-btn" type="button" aria-label="Toggle dark mode" title="Toggle dark mode">
      <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><g stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"><circle cx="12" cy="12" r="4.4"/><path d="M12 2.5v2.4M12 19.1v2.4M2.5 12h2.4M19.1 12h2.4M5.3 5.3l1.7 1.7M17 17l1.7 1.7M18.7 5.3 17 7M7 17l-1.7 1.7"/></g></svg>
    </button>
  </header>

  <main class="admin-main">
    <div class="admin-head">
      <h1>Admin</h1>
      <p>Upload projects, link their GitHub sources, and manage the gallery.</p>
    </div>

    <section id="login-view" class="panel" hidden>
      <h2>Sign in</h2>
      <form id="login-form">
        <label>Email
          <input type="email" id="login-email" required autocomplete="username">
        </label>
        <label>Password
          <input type="password" id="login-password" required autocomplete="current-password">
        </label>
        <button type="submit" class="btn">Sign in</button>
      </form>
      <p id="login-error" class="error" role="status"></p>
    </section>

    <section id="admin-view" hidden>
      <div class="admin-bar">
        <span class="who">Signed in as <strong id="admin-email"></strong></span>
        <span>
          <button type="button" id="backup" class="btn btn-ghost">Download backup (JSON)</button>
          <button type="button" id="logout" class="btn btn-ghost">Sign out</button>
        </span>
      </div>

      <div class="panel">
        <h2>Add a project</h2>
        <form id="upload-form">
          <label>Photo
            <input type="file" id="photo" accept="image/*" required>
          </label>
          <label>Title
            <input type="text" id="title" maxlength="120" required>
          </label>
          <label>Description
            <textarea id="description" maxlength="500"></textarea>
          </label>
          <label>GitHub link
            <input type="url" id="github" placeholder="https://github.com/you/repo">
          </label>
          <button type="submit" class="btn">Upload</button>
        </form>
        <p id="upload-msg" class="status-msg" role="status"></p>
      </div>

      <div class="panel">
        <h2>Existing projects</h2>
        <ul id="works-list"></ul>
      </div>
    </section>
  </main>

  <script src="firebase-config.js"></script>
  <script src="common.js"></script>
  <script src="admin.js"></script>
</body>
</html>
